<svg xmlns="http://www.w3.org/2000/svg" width="424" height="184" role="img" aria-label="MAYA: FLATTEN TO BEST FIT PLANE">
  <title>MAYA: FLATTEN TO BEST FIT PLANE</title>

  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="400" height="160" fill="none" stroke="#4a4f5a" stroke-width="2" rx="4"/>

    <g shape-rendering="crispEdges">
      <rect x="1" y="1" width="74" height="28" fill="#2e3440"/>
      <rect x="75" y="1" width="324" height="28" fill="#2d65a9"/>
    </g>

    <rect x="1" y="29" width="398" height="130" fill="#1e2129"/>

    <image x="9" y="8" width="14" height="14" href="data:image/svg+xml;base64,"/>
    <text x="47" y="18.9" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">MAYA</text>
    <text x="85" y="18.9" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="start">FLATTEN TO BEST FIT PLANE</text>

    <foreignObject x="20" y="40" width="360" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#c5c8ce; font-family:Verdana,Geneva,DejaVu Sans,sans-serif; font-size:13px; line-height: 20px; text-align:left;">
        Maya script that automatically calculates and flattens selected components to a best-fit plane. Select any faces, vertices, or edges and flatten them without manually defining an axis.
      </div>
    </foreignObject>

    <text x="20" y="145" fill="#6a7080" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10">maya_flatten_to_best_fit_plane.py</text>
  </g>
</svg>
