<svg xmlns="http://www.w3.org/2000/svg" width="450" height="210" role="img" aria-label="UNITY: FBX TO PRIMITIVE COLLIDERS">
  <title>UNITY: FBX TO PRIMITIVE COLLIDERS</title>

  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="400" height="160" fill="none" stroke="#4a4f5a" stroke-width="2" rx="4"/>

    <g shape-rendering="crispEdges">
      <rect x="1" y="1" width="74" height="28" fill="#2e3440"/>
      <rect x="75" y="1" width="324" height="28" fill="#4a6741"/>
    </g>

    <rect x="1" y="29" width="398" height="130" fill="#1e2129"/>

    <image x="9" y="8" width="14" height="14" href="data:image/svg+xml;base64,"/>
    <text x="47" y="18.9" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">UNITY</text>
    <text x="85" y="18.9" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="start">FBX TO PRIMITIVE COLLIDERS</text>

    <foreignObject x="20" y="40" width="360" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:#c5c8ce; font-family:Verdana,Geneva,DejaVu Sans,sans-serif; font-size:13px; line-height: 20px; text-align:left;">
        Unity editor script that converts imported cube meshes from DCC apps (Maya, Blender, etc.) into primitive box colliders. Replaces mesh colliders with optimized primitive box colliders.
      </div>
    </foreignObject>

    <text x="20" y="145" fill="#6a7080" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10">FBXToPrimitiveCubesColliders.cs</text>
  </g>
</svg>
